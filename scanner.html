<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scan Gudang Teknik</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{ --bir:#1F4E78; --hij:#1E7A46; --abu:#6B7280; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        background:#F3F4F6; color:#111; font-size:16px; }
  header{ background:var(--bir); color:#fff; padding:12px 14px; }
  header h1{ margin:0; font-size:16px; font-weight:600; }
  .tab{ display:flex; }
  .tab button{ flex:1; padding:13px; border:0; font-size:15px; font-weight:600;
        background:#D8DEE6; color:#333; }
  .tab button.on{ background:#fff; color:var(--bir); box-shadow:inset 0 -3px 0 var(--bir); }
  .backlog{ font-size:13px; padding:9px 14px; background:#FFF4CE; color:#6B4E00; }
  .wrap{ padding:14px; }
  .card{ background:#fff; border-radius:10px; padding:14px; margin-bottom:12px;
         box-shadow:0 1px 3px rgba(0,0,0,.12); }
  label{ display:block; font-size:13px; color:var(--abu); margin:10px 0 4px; font-weight:600; }
  input{ width:100%; padding:12px; font-size:17px; border:1px solid #CBD5E1; border-radius:8px; }
  input:focus{ outline:2px solid var(--bir); border-color:var(--bir); }
  button.aksi{ width:100%; padding:15px; font-size:16px; font-weight:700; border:0;
        border-radius:8px; color:#fff; background:var(--bir); margin-top:12px; }
  button.simpan{ background:var(--hij); }
  button.batal{ background:#9AA5B1; }
  #reader{ width:100%; border-radius:10px; overflow:hidden; margin-top:10px; }
  #reader video{ width:100% !important; border-radius:10px; }
  .item .kode{ font-weight:700; color:var(--bir); font-size:16px; }
  .item .desc{ margin:4px 0; font-size:15px; }
  .item .meta{ font-size:13px; color:var(--abu); }
  .pesan{ padding:11px; border-radius:8px; font-size:14px; margin-top:10px; }
  .ok{ background:#E3F5EA; color:#14532D; } .err{ background:#FDE7E5; color:#7F1D1D; }
  .hasil{ max-height:240px; overflow-y:auto; margin-top:6px; }
  .hasil div{ padding:11px; border-bottom:1px solid #E5E7EB; }
  .hasil .k{ font-weight:700; color:var(--bir); font-size:14px; }
  .hasil .d{ font-size:13px; }
  .kecil{ font-size:12px; color:var(--abu); text-align:center; margin-top:12px; }
  .sembunyi{ display:none !important; }
</style>
</head>
<body>

<!-- ====== ISI DUA BARIS INI SEBELUM DIPAKAI ====== -->
<script>
  var API   = 'https://script.google.com/macros/s/AKfycbxjQfRwy4FmGdYFLJhmbbB_YOyXVpgALongzEpnfhhp7_dRa9DkcExHKHfnwWdpYIKv/exec';   // .../exec dari Apps Script
  var TOKEN = '1234';        // harus sama dengan di Code.gs
</script>
<!-- =============================================== -->

<header><h1>Scan Gudang Teknik</h1></header>

<div class="tab">
  <button id="tMasuk" class="on" onclick="setMode('masuk')">BARANG MASUK</button>
  <button id="tKeluar"          onclick="setMode('keluar')">BARANG KELUAR</button>
</div>
<div class="backlog" id="backlog">Memuat…</div>

<div class="wrap">
  <div class="card">
    <button class="aksi" id="btnScan" onclick="toggleScan()">BUKA KAMERA</button>
    <div id="reader" class="sembunyi"></div>
    <label>Atau cari manual</label>
    <input id="q" placeholder="ketik kode / nama barang" oninput="cari()" autocomplete="off">
    <div class="hasil" id="hasil"></div>
  </div>

  <div class="card sembunyi" id="kartu">
    <div class="item">
      <div class="kode" id="iKode"></div>
      <div class="desc" id="iDesc"></div>
      <div class="meta" id="iMeta"></div>
    </div>
    <label>Qty <span id="lUom"></span></label>
    <input id="qty" type="number" inputmode="decimal" min="0" step="any">
    <label id="lDok">No PO / Surat Jalan</label>
    <input id="dok" autocomplete="off">
    <label id="lOrg">Nama Penerima</label>
    <input id="org" autocomplete="off">
    <div id="barisKet" class="sembunyi">
      <label>Cost Center</label>
      <input id="ket" autocomplete="off">
    </div>
    <button class="aksi simpan" id="btnSimpan" onclick="simpan()">SIMPAN</button>
    <button class="aksi batal" onclick="reset()">BATAL</button>
  </div>

  <div id="pesan"></div>
  <div class="kecil">Catatan sementara. SAP tetap sumber resmi.</div>
</div>

<script>
var mode='masuk', terpilih=null, scanner=null, jalan=false, timer=null;

/* --- panggil Apps Script tanpa memicu preflight CORS --- */
function api(muatan){
  return fetch(API, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token:TOKEN }, muatan))
  }).then(function(r){ return r.json(); });
}

function setMode(m){
  mode=m;
  document.getElementById('tMasuk').className  = (m==='masuk')?'on':'';
  document.getElementById('tKeluar').className = (m==='keluar')?'on':'';
  document.getElementById('lDok').textContent = (m==='masuk')?'No PO / Surat Jalan':'No Work Order';
  document.getElementById('lOrg').textContent = (m==='masuk')?'Nama Penerima':'Nama Pengambil';
  document.getElementById('barisKet').className = (m==='masuk')?'sembunyi':'';
  reset();
}

function toggleScan(){
  if (jalan){ hentikan(); return; }
  var kotak=document.getElementById('reader');
  kotak.classList.remove('sembunyi');
  document.getElementById('btnScan').textContent='TUTUP KAMERA';
  jalan=true;
  scanner=new Html5Qrcode('reader', {
    formatsToSupport:[
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.DATA_MATRIX
    ]
  });
  scanner.start({ facingMode:'environment' },
    { fps:12, qrbox:{ width:250, height:250 } },
    function(teks){ if(navigator.vibrate) navigator.vibrate(60); hentikan(); ambil(teks); },
    function(){}
  ).catch(function(e){
    jalan=false; kotak.classList.add('sembunyi');
    document.getElementById('btnScan').textContent='BUKA KAMERA';
    tampil('Kamera gagal dibuka: '+e+'. Pastikan halaman dibuka lewat HTTPS dan izin kamera diberikan.', false);
  });
}

function hentikan(){
  if (scanner && jalan){ scanner.stop().then(function(){ scanner.clear(); }).catch(function(){}); }
  jalan=false;
  document.getElementById('reader').classList.add('sembunyi');
  document.getElementById('btnScan').textContent='BUKA KAMERA';
}

function ambil(kode){
  tampil('Mencari '+kode+'…', true);
  api({ aksi:'cari', kode:kode }).then(function(r){
    if(!r.ok){ tampil(r.pesan+' Coba cari manual.', false); return; }
    pilih(r);
  }).catch(gagal);
}

function cari(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    var q=document.getElementById('q').value;
    if(q.trim().length<3){ document.getElementById('hasil').innerHTML=''; return; }
    api({ aksi:'teks', kueri:q }).then(function(r){
      var h=document.getElementById('hasil'), list=(r.hasil||[]);
      h.innerHTML = list.length ? list.map(function(x){
        return '<div onclick="ambil(\\''+x.kode+'\\')"><div class="k">'+x.kode+
               '</div><div class="d">'+x.deskripsi+'</div></div>';
      }).join('') : '<div class="d">Tidak ada yang cocok.</div>';
    }).catch(gagal);
  }, 350);
}

function pilih(r){
  terpilih=r;
  document.getElementById('iKode').textContent=r.kode;
  document.getElementById('iDesc').textContent=r.deskripsi;
  document.getElementById('iMeta').textContent =
    'UOM '+r.uom+' · Gudang '+r.gudang+' · Stok SAP '+r.stok+' · Rak '+r.rak;
  document.getElementById('lUom').textContent='('+r.uom+')';
  document.getElementById('kartu').classList.remove('sembunyi');
  document.getElementById('hasil').innerHTML='';
  document.getElementById('q').value='';
  document.getElementById('pesan').innerHTML='';
  document.getElementById('qty').focus();
}

function simpan(){
  if(!terpilih){ tampil('Belum ada material dipilih.', false); return; }
  var qty=document.getElementById('qty').value;
  if(!(Number(qty)>0)){ tampil('Qty harus lebih dari nol.', false); return; }
  var b=document.getElementById('btnSimpan');
  b.disabled=true; b.textContent='MENYIMPAN…';
  api({ aksi:'simpan', data:{
    jenis:mode, kode:terpilih.kode, qty:qty,
    dokumen:document.getElementById('dok').value,
    orang:document.getElementById('org').value,
    ket:(mode==='keluar')?document.getElementById('ket').value:''
  }}).then(function(r){
    b.disabled=false; b.textContent='SIMPAN';
    if(!r.ok){ tampil(r.pesan||'Gagal menyimpan.', false); return; }
    tampil('Tersimpan: '+r.deskripsi+' — '+r.qty+' '+r.uom+' (baris '+r.baris+')', true);
    reset(); muatBacklog();
  }).catch(function(e){ b.disabled=false; b.textContent='SIMPAN'; gagal(e); });
}

function reset(){
  terpilih=null;
  document.getElementById('kartu').classList.add('sembunyi');
  ['qty','dok','org','ket'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('hasil').innerHTML='';
}
function tampil(t,ok){
  document.getElementById('pesan').innerHTML='<div class="pesan '+(ok?'ok':'err')+'">'+t+'</div>';
}
function gagal(e){ tampil('Gagal terhubung: '+(e&&e.message?e.message:e), false); }
function muatBacklog(){
  api({ aksi:'ringkasan' }).then(function(r){
    var d=r.data||{masuk:'?',keluar:'?'};
    document.getElementById('backlog').textContent =
      'Belum masuk SAP — Masuk: '+d.masuk+' · Keluar: '+d.keluar;
  }).catch(function(){
    document.getElementById('backlog').textContent='Backlog tidak bisa dimuat.';
  });
}
muatBacklog();
</script>
</body>
</html>
